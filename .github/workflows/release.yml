name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the simulation
        run: |
          cd watersim && cargo test --release && cd ..
          cd simtest  && cargo test --release && cd ..
      - name: Validate shaders
        run: cd shadercheck && cargo run --release
      - name: Build release files
        run: python3 scripts/pack.py
      - name: Check the shader pack with Horizon's own checker
        run: |
          cargo install --locked --git https://github.com/ludovic111/horizon \
            --rev f4dcf8a2fb4a68b2d28422f4d34d2be2970e26bd horizon-shader-api --bin horizon-shader
          horizon-shader check dist/real_water-*.hshader
      - name: Decide the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            dist/real_water-*.hshader \
            dist/realphysics-*.hnmod \
            --title "Real Physics ${{ steps.tag.outputs.name }}" \
            --latest \
            --notes "**Water look:** drag \`real_water-*.hshader\` onto the Horizon launcher, then pick Real Water in Options > Video Settings > Shaders > Shader Packs. **Trees, sand, water physics:** launcher Mods page > Add from GitHub > paste this repo's link > Build (preview)."
