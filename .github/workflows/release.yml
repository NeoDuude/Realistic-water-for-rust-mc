name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the simulation
        run: |
          cd watersim && cargo test --release && cd ..
          cd simtest  && cargo test --release && cd ..
      - name: Validate shaders
        run: cd shadercheck && cargo run --release
      - name: Build the .hnmod
        run: python3 scripts/pack.py
      - name: Decide the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" dist/realphysics-*.hnmod \
            --title "Real Physics ${{ steps.tag.outputs.name }}" \
            --prerelease \
            --notes "Preview build. **Working:** falling trees, sliding sand, volume-keeping block water. **Included but not yet drawn in-game:** the FLIP GPU water (simulation + shaders are done and tested/validated, the on-screen rendering is not wired up yet). Nothing has run in a live game yet — expect rough edges. Install: \`horizon-launcher native-install realphysics-*.hnmod --instance <instance> --trust-native-code\`."
